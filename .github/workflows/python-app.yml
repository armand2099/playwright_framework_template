# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Sanity test

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    - name: Set up Python 3.14.7
      uses: actions/setup-python@v5
      with:
        python-version: "3.14.7"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install playwright
        playwright install
        pip install pytest
        pip install pytest-playwright
        pip install pytest-html
        pip install pytest-asyncio
        pip install pytest-xdist
    - name: Test with pytest and Chrome
      run: |
        #python -m pytest -n 3 -v -s tests -m "not AUTH"
        python -m pytest --md-report --md-report-verbose=1 -n 3 -v -s tests -m "not AUTH" >> $GITHUB_STEP_SUMMARY
    - name: Upload Test Report
      if: always() # Ensures the report is uploaded even if tests fail
      uses: actions/upload-artifact@v4
      with:
        name: pytest-html-report-chrome
        path: Reports/report.html
    - name: Test with pytest and Firefox
      run: |
        #python -m pytest --browser-type=Firefox -n 3 -v -s tests -m "not AUTH"
        python -m pytest --browser-type=Firefox --md-report --md-report-verbose=1 -n 3 -v -s tests -m "not AUTH" >> $GITHUB_STEP_SUMMARY
    - name: Upload Test Report
      if: always() # Ensures the report is uploaded even if tests fail
      uses: actions/upload-artifact@v4
      with:
        name: pytest-html-report-firefox
        path: Reports/report.html
