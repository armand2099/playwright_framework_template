# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Sanity test

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    - name: Set up Python 3.14.7
      uses: actions/setup-python@v5
      with:
        python-version: "3.14.7"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install playwright
        playwright install
        pip install pytest
        pip install pytest-playwright
        pip install pytest-html
        pip install pytest-asyncio
        pip install pytest-xdist
        pip install pytest pytest-md-report
    - name: Test with pytest and Chrome
      run: |
        #python -m pytest -n 3 -v -s tests -m "not AUTH"
        python -m pytest --html=Reports/report.html --self-contained-html -n 3 -v -s tests -m "not AUTH"
    - name: Upload Test Report
      if: always() # Ensures the report is uploaded even if tests fail
      uses: actions/upload-pages-artifact@v3
      with:
        path: Reports/
    - name: Test with pytest and Firefox
      run: |
        #python -m pytest --browser-type=Firefox -n 3 -v -s tests -m "not AUTH"
        python -m pytest --html=Reports/report.html --self-contained-html --browser-type=Firefox -n 3 -v -s tests -m "not AUTH"
    - name: Upload Test Report
      if: always() # Ensures the report is uploaded even if tests fail
      uses: actions/upload-pages-artifact@v3
      with:
        path: Reports/report.html

  deploy:
    needs: build
    if: always() # Deploy even if some test assertions failed, so you can inspect the report
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}report.html
    runs-on: ubuntu-latest
    steps:
      # Step 2: Deploy the uploaded artifact to GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
