[pytest]
pythonpath = .
log_level = INFO
#addopts = -v -s --html=./Reports/report.html --self-contained-html
addopts = -v -s --reruns 4 --reruns-delay 1
markers =
    API: API tests
    BAT: Browser automation tests
    AUTH: Browser authenticated tests
    DIAL: Dialog handeling test
    TAB: Window handeling tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session